<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartSupport — Customer Support Chatbot</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <div class="chat-card">

    <!-- Header -->
    <header class="chat-header">
      <div class="header-left">
        <div class="bot-avatar">🛍️</div>
        <div>
          <h1>SmartSupport</h1>
          <p>Your Rule-Based Customer Support Assistant</p>
        </div>
      </div>
      <button id="clearBtn" class="clear-btn" title="Clear chat">🗑️ Clear</button>
    </header>

    <!-- Chat messages -->
    <main id="chatArea" class="chat-area">
      <!-- Messages are injected here by script.js -->
    </main>

    <!-- Typing indicator -->
    <div id="typingIndicator" class="typing-indicator hidden">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      SmartSupport is typing...
    </div>

    <!-- Quick action buttons -->
    <div class="quick-actions">
      <button class="quick-btn" data-message="Track my order">📦 Track Order</button>
      <button class="quick-btn" data-message="I want to return my product">↩️ Return / Refund</button>
      <button class="quick-btn" data-message="My payment failed">💳 Payment Issue</button>
      <button class="quick-btn" data-message="How long does delivery take?">🚚 Delivery</button>
      <button class="quick-btn" data-message="I want to cancel my order">❌ Cancel Order</button>
      <button class="quick-btn" data-message="Contact customer support">👨‍💻 Contact Support</button>
    </div>

    <!-- Input area -->
    <footer class="chat-input-area">
      <input
        type="text"
        id="messageInput"
        placeholder="Type your message..."
        autocomplete="off"
        maxlength="500"
      />
      <button id="sendBtn" class="send-btn" title="Send">➤</button>
    </footer>

  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
